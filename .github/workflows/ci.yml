name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The mcp extra is installed so the MCP tests run against the real
        # SDK rather than only against fakes of it — a fake modelling an old
        # SDK once let an HTTP transport that never worked pass CI.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Lint (errors only)
        run: ruff check agent_framework/ --select F,E9
      - name: Tests
        run: pytest agent_framework/tests/ -q
